<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eWedding</title>

    <link rel="stylesheet" href="css/style.css">
	
</head>

<body>

    <div id="hero">

        <p id="welcome"></p>

        <h1 id="couple"></h1>

        <p class="subtitle">Dengan penuh kesyukuran</p>

        <p id="eventDate"></p>

        <p id="venue"></p>
		
		<div id="countdown">Loading countdown...</div>
    
	</div>
	
	<section id="event-section">

    <h2>Maklumat Majlis</h2>

    <div class="event-card">

        <div class="event-item">
            <h3>Tarikh</h3>
            <p id="eventDateDetail"></p>
        </div>

        <div class="event-item">
            <h3>Masa</h3>
            <p id="eventTime"></p>
        </div>

        <div class="event-item">
            <h3>Lokasi</h3>
            <p id="eventVenue"></p>
        </div>

        <a id="mapsButton" target="_blank">
            Buka Google Maps
        </a>

    </div>

</section>
	
	<section id="story-section">

    <h2>Our Story</h2>

    <div id="story-container"></div>

	</section>
	
	
	<script src="js/script.js"></script>

</body>

</html>
